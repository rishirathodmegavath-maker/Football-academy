#!/usr/sbin/nft -f
# Host firewall for the single Sportozen server (WP7). Do not load this file by
# hand: use deploy/host/apply-firewall.sh, which refuses the placeholder
# addresses below, checks the syntax, loads it, and removes it again unless you
# confirm within 60 seconds that you can still connect.
#
# Set ADMIN_CIDR (IPv4) and ADMIN_CIDR6 (IPv6) to the ranges administrators
# connect from (an office or a VPN). If administrators have no IPv6 address, leave
# ADMIN_CIDR6 at the documentation prefix: that range never matches real traffic.
#
# Policy: nothing comes in unless it is listed. The application listens on
# 127.0.0.1:3000 only, so it is not reachable from outside whatever this says;
# this file is the second lock on the door, not the first.
define ADMIN_CIDR = 192.0.2.0/24     # PLACEHOLDER: replace
define ADMIN_CIDR6 = 2001:db8::/32   # documentation prefix: replace or leave unused

# Reloading replaces the table instead of adding to it, so a changed address
# range really replaces the old one.
table inet sportozen
delete table inet sportozen

table inet sportozen {
  chain input {
    type filter hook input priority 0; policy drop;

    iif lo accept
    ct state established,related accept
    ct state invalid drop

    # Path MTU discovery and neighbour discovery must work; ping is limited.
    ip protocol icmp icmp type { destination-unreachable, time-exceeded, parameter-problem } accept
    ip protocol icmp icmp type echo-request limit rate 5/second accept
    ip6 nexthdr icmpv6 icmpv6 type { destination-unreachable, packet-too-big, time-exceeded, parameter-problem, nd-neighbor-solicit, nd-neighbor-advert, nd-router-advert } accept
    ip6 nexthdr icmpv6 icmpv6 type echo-request limit rate 5/second accept

    # Administration, from the named ranges only, with a cap on new connections
    # (generous enough for scripted deployments over one SSH session each).
    ip saddr $ADMIN_CIDR tcp dport 22 ct state new limit rate 30/minute accept
    ip6 saddr $ADMIN_CIDR6 tcp dport 22 ct state new limit rate 30/minute accept

    # The public web: HTTP (certificate renewal and redirect to HTTPS) and HTTPS.
    tcp dport { 80, 443 } accept
  }
  chain forward {
    type filter hook forward priority 0; policy drop;
  }
  chain output {
    type filter hook output priority 0; policy accept;
  }
}
