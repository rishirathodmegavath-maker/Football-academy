# /etc/fail2ban/filter.d/sportozen-auth.conf (WP7)
# Counts refused authentication requests in the nginx access log (combined
# format): failed or rate-limited sign-in, sign-up, second-step and reset calls.
[Definition]
failregex = ^<HOST> .*"POST /api/auth/(?:sign-in|sign-up|two-factor|request-password-reset|reset-password)\S* HTTP/[\d.]+" (?:400|401|403|422|429) 
ignoreregex =
