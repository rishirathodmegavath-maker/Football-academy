# /etc/ssh/sshd_config.d/10-sportozen.conf (WP7). Keys only, no root, few tries.
# Test before reloading:  sshd -t   and keep a second session open.
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
PubkeyAuthentication yes
AuthenticationMethods publickey
MaxAuthTries 6
LoginGraceTime 20
ClientAliveInterval 300
ClientAliveCountMax 2
X11Forwarding no
AllowAgentForwarding no
AllowTcpForwarding no
PermitEmptyPasswords no
# AllowUsers deploy-admin   # name the administrators here
