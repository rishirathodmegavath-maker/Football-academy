# /etc/nginx/snippets/sportozen-proxy.conf
# Shared by every location. A client-supplied X-Forwarded-For, X-Real-IP or
# Forwarded header is replaced, never extended: the application and Better
# Auth then see exactly one value, the address nginx itself accepted.
proxy_pass http://127.0.0.1:3000;
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header Forwarded "";
# One id per request, generated here and stamped on the access log line, the
# application's own log lines and the X-Request-Id response header, so a report
# from a user can be followed through all three. A client-supplied value is
# replaced, not trusted.
proxy_set_header X-Request-ID $request_id;
proxy_connect_timeout 5s;
proxy_read_timeout 60s;
proxy_send_timeout 60s;
# Do not cache anything: responses are private (Cache-Control: no-store).
proxy_buffering on;
proxy_cache off;
